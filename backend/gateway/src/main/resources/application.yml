server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: "${AUTH_URL:http://localhost:8081}"
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/addresses/**
        - id: catalog-service
          uri: "${CATALOG_URL:http://localhost:8082}"
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**,/api/v1/reviews/**,/api/v1/wishlist/**,/uploads/**
        - id: inventory-service
          uri: "${INVENTORY_URL:http://localhost:8083}"
          predicates:
            - Path=/api/v1/inventory/**
        - id: cart-service
          uri: "${CART_URL:http://localhost:8084}"
          predicates:
            - Path=/api/v1/cart/**
        - id: promotion-service
          uri: "${PROMOTION_URL:http://localhost:8085}"
          predicates:
            - Path=/api/v1/coupons/**
        - id: order-service
          uri: "${ORDER_URL:http://localhost:8086}"
          predicates:
            - Path=/api/v1/orders/**,/api/v1/admin/orders/**,/api/v1/admin/stats/**
        - id: payment-service
          uri: "${PAYMENT_URL:http://localhost:8087}"
          predicates:
            - Path=/api/v1/payments/**

app:
  jwt:
    secret: "${JWT_SECRET:change-this-256-bit-secret-key-for-local-dev-only-please-32bytes}"
  internal-token: "${INTERNAL_TOKEN:dev-internal-token-change-in-prod}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
